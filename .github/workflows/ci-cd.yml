name: CI/CD Nutrite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests unitarios
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código del repo
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Ejecutar los tests
        run: npm test

  deploy:
    name: Publicar en Vercel
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Avisar a Vercel que publique la nueva versión
        run: curl --fail -X POST "${{ secrets.VERCEL_DEPLOY_HOOK }}"